[project]
name = "fleetmaint"
version = "1.0.0"
description = "Predictive maintenance for a synthetic 400-van delivery fleet: Weibull survival and gradient boosting failure models, a shop scheduler with bay and parts limits, and a held-out year that prices four maintenance policies."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
fleetmaint = "fleetmaint.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetmaint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
